[package]
name = "hashdex-web"
version = "0.1.0"
edition = "2021"
publish = false
description = "Browser resolver for hashdex: drop a file, see where it lives on the web"
license = "MIT"

# Not a workspace member of the published crate — its own root, so the
# crates.io package and its allowlist stay untouched.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hashdex = { path = "..", default-features = false }
anyhow = "1"
bytes = "1"
parquet = { version = "59.1.0", default-features = false, features = ["zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "WorkerGlobalScope",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
] }
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "s"
