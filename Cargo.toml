[package]
name = "hashdex"
version = "0.1.0"
edition = "2021"
description = "hdx — resolve any hash against the indexes the world already maintains"
license = "MIT"
repository = "https://github.com/davidar/hashdex"
readme = "README.md"
keywords = ["hash", "sha256", "bloom-filter", "provenance", "forensics"]
categories = ["command-line-utilities", "filesystem"]
# Allowlist: the crate ships what cargo needs to build the binary.
# Docs, tools, tests, and fixtures live in the GitHub repo.
include = ["/src", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "hdx"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The native side: CLI, network backends, mmap filters, sqlite cache.
# Without it the remaining core compiles for wasm32.
cli = [
    "dep:clap",
    "dep:tokio",
    "dep:reqwest",
    "dep:rusqlite",
    "dep:dirs",
    "dep:walkdir",
    "dep:memmap2",
    "dep:flate2",
    "dep:futures",
    # peek (the hashoscope): container-format readers, all pure Rust
    # except liblzma/zstd (static C; zstd already proven in the tree
    # via parquet). backhand's lzo feature is GPL — never enable it.
    "dep:tar",
    "dep:zip",
    "dep:ar",
    "dep:zstd",
    "dep:bzip2",
    "dep:tempfile",
    "dep:liblzma",
    # erofs needs raw MicroLZMA (liblzma-sys binds it; same build as
    # liblzma above) and lz4 block decompression.
    "dep:liblzma-sys",
    "dep:lz4_flex",
    "dep:backhand",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "blocking", "http2"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
data-encoding = "2"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
futures = { version = "0.3", optional = true }
dirs = { version = "5", optional = true }
walkdir = { version = "2", optional = true }
memmap2 = { version = "0.9", optional = true }
flate2 = { version = "1", optional = true }
parquet = { version = "59.1.0", default-features = false, features = ["zstd"] }
bytes = "1.12.1"
tar = { version = "0.4.46", optional = true }
zip = { version = "8.6.0", optional = true, default-features = false, features = ["bzip2", "deflate", "zstd"] }
ar = { version = "0.9.0", optional = true }
zstd = { version = "0.13.3", optional = true }
bzip2 = { version = "0.6.1", optional = true }
tempfile = { version = "3.27.0", optional = true }
liblzma = { version = "0.4.8", optional = true }
liblzma-sys = { version = "0.4.8", optional = true }
lz4_flex = { version = "0.12", default-features = false, features = ["std", "safe-decode"], optional = true }
backhand = { version = "0.25.1", default-features = false, features = ["gzip", "zstd", "xz"], optional = true }

[dev-dependencies]
ar = "0.9.0"
# The peek tests build a tiny squashfs fixture with the same crate the
# binary reads it with.
backhand = { version = "0.25.1", default-features = false, features = ["gzip", "zstd", "xz"] }
flate2 = "1"
# The CLI tests write tiny fixture datasets (the same page-oriented
# parquet the published repos hold) into their scratch cache dirs.
parquet = { version = "59.1.0", default-features = false }
tar = "0.4.46"
zip = "8.6.0"

[profile.release]
lto = true
